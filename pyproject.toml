[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-verge-traffic-ledger"
version = "0.2.0"
description = "Clash Verge traffic ledger for Mihomo-compatible cores"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Timmy" }
]
dependencies = []

[project.scripts]
clash-verge-traffic-ledger = "clash_verge_traffic_ledger.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
