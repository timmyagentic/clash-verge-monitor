[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-verge-traffic-ledger"
version = "0.4.0rc1"
description = "Clash Verge traffic ledger for Mihomo-compatible cores"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Timmy" }
]
dependencies = []

[project.scripts]
clash-verge-traffic-ledger = "clash_verge_traffic_ledger.__main__:main"

[project.urls]
Repository = "https://github.com/timmyagentic/clash-verge-traffic-ledger"
Changelog = "https://github.com/timmyagentic/clash-verge-traffic-ledger/blob/main/CHANGELOG.md"
Issues = "https://github.com/timmyagentic/clash-verge-traffic-ledger/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clash_verge_traffic_ledger = ["assets/*.js", "assets/*.css", "assets/*.md", "assets/icons/*.svg", "assets/icons/LICENSE"]
