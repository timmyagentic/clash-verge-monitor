[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-verge-monitor"
version = "0.3.2"
description = "Clash Verge Monitor for Mihomo-compatible cores"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Timmy" }
]
dependencies = []

[project.scripts]
clash-verge-traffic-ledger = "clash_verge_monitor.__main__:main"
clash-verge-monitor = "clash_verge_monitor.__main__:main"

[project.urls]
Repository = "https://github.com/timmyagentic/clash-verge-monitor"
Changelog = "https://github.com/timmyagentic/clash-verge-monitor/blob/main/CHANGELOG.md"
Issues = "https://github.com/timmyagentic/clash-verge-monitor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clash_verge_monitor = ["assets/*.js", "assets/*.css", "assets/*.md", "assets/icons/*.svg", "assets/icons/LICENSE"]
