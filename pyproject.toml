[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mihomo-flow-ledger"
version = "0.1.0"
description = "Local Mihomo and Clash Verge traffic ledger"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Timmy" }
]
dependencies = []

[project.scripts]
mihomo-flow-ledger = "mihomo_flow_ledger.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

